name: Validate tax data

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-tax-data:
    name: Validate tax data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-and-dependencies

      - name: Validate tax data
        run: npm run validate-tax-data
