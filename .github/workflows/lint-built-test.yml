name: Lint, Build, and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-build-test:
    name: Lint, build, and test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/node-and-dependencies

      - uses: ./.github/actions/cache-nextjs

      # `next build` only typechecks its own module graph, so the test files
      # were never checked.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # The only schema guard over src/data. AGENTS.md requires it after any
      # data change, so enforce it rather than trusting the checklist.
      - name: Validate tax data
        run: npm run validate-tax-data

      # Next.js lints as part of the build (see `eslint.dirs` in
      # next.config.mjs, which matches the `lint` script's scope).
      - name: Build
        env:
          NODE_ENV: "test"
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Playwright's `webServer` serves the `out/` export built above on the
      # port its baseURL points at, and waits for it to answer. Backgrounding a
      # server here instead raced the suite and left it on the wrong port.
      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
